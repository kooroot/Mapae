<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>마패 · Mapae Console</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
            Four families, each covering a script the others do not. Google's
            Nanum Myeongjo build is Hangul + Latin with no Hanja, and IBM Plex
            Mono carries no Hangul at all; without the two companions the 馬牌
            crest fell back to the platform serif and every Korean label in a
            mono context switched typeface mid-line. Unicode-range subsetting
            means a browser downloads only the slices a page actually paints.
        -->
        <link
            href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@800&family=IBM+Plex+Mono:wght@400;500;600&family=Nanum+Gothic+Coding&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
