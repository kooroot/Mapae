name: Monitor

# The public probes from a machine that is not the serving Mac, which cannot report its own
# death. A red run is the alert: GitHub mails a failed scheduled run to whoever last changed
# the cron below. Off the hour on purpose — scheduled runs at :00 queue the longest.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  probe:
    name: Public probes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe the site, seller, facilitator, arcade ticket and faucet
        env:
          NO_COLOR: "1"
        run: bun scripts/ops/check.ts
