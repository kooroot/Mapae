name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the repository gate
        env:
          CI: "true"
          NO_COLOR: "1"
        run: bun run check

      - name: Run hermetic delegation negative paths
        env:
          CI: "true"
          NO_COLOR: "1"
        working-directory: apps/delegation-lab
        run: bun run test:negative
